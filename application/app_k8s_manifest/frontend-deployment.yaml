apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: backend
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: 195275640975.dkr.ecr.us-east-1.amazonaws.com/capstone-frontend:1.0.0
        ports:
        - containerPort: 80