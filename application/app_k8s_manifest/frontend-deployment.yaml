apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: frontend
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend-container
        image: -------
        ports:
        - containerPort: 3000
        env:
        - name: BACKEND_URL
          value: http://backend-service.backend.svc.cluster.local

